<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ROMEO ULTIMATE FIGHTING AUTOCHESS THING AK'S A BITCH BOY - sim lab</title>
<style>
  :root { --bg:#1a1410; --panel:#2a2119; --ink:#f1e6d0; --dim:#a8977c; --acc:#d9a441; --red:#c4513a; --grn:#6aa65a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:12px 16px 24px; }
  h1 { font-size:18px; margin:6px 0 10px; letter-spacing:.08em; color:var(--acc); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  select, button { background:var(--panel); color:var(--ink); border:1px solid #4a3b2c; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#1a1410; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; background:#000; }
  .huds { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
  .hud { background:var(--panel); border-radius:8px; padding:8px 10px; }
  .hud .name { font-weight:600; }
  .meter { height:10px; background:#120e0a; border-radius:5px; overflow:hidden; margin:4px 0; }
  .meter i { display:block; height:100%; background:var(--grn); transition:width .12s; }
  .zones { display:flex; gap:5px; margin-top:4px; font-size:11px; color:var(--dim); flex-wrap:wrap; }
  .zones span { padding:1px 6px; border-radius:10px; background:#3a2e22; }
  .zones .hurt { background:#7a5b25; color:#fff; } .zones .crippled { background:#a2452f; color:#fff; } .zones .disabled { background:#000; color:#c4513a; text-decoration:line-through; }
  #ticker { background:var(--panel); border-radius:8px; padding:8px 10px; height:170px; overflow:auto; font-size:13px; }
  #ticker div { padding:1px 0; } #ticker .big { color:var(--acc); font-weight:600; } #ticker .dim { color:var(--dim); }
  .res { margin:8px 0; font-size:15px; color:var(--acc); min-height:22px; }
  label { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ROMEO ULTIMATE FIGHTING AUTOCHESS THING AK'S A BITCH BOY <small style="color:#a8977c;font-weight:400">sim lab</small></h1>
  <div class="bar">
    <select id="a"></select> <span>vs</span> <select id="b"></select>
    <label>Lv <select id="lvl"></select></label>
    <button id="fight">New fight</button>
    <button id="replay">Replay</button>
    <span style="flex:1"></span>
    <button data-speed="0">❚❚</button><button data-speed="1" class="on">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button><button data-speed="999">Skip</button>
  </div>
  <canvas id="c" width="960" height="480"></canvas>
  <div class="huds"><div class="hud" id="h0"></div><div class="hud" id="h1"></div></div>
  <div class="res" id="res"></div>
  <div id="ticker"></div>
  <p style="color:#a8977c;font-size:12px">Seed: <span id="seed"></span> — same seed + fighters replays the exact same fight.</p>
</div>
<script type="module" src="/src/lab.ts"></script>
</body>
</html>
